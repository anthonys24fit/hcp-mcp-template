# HouseCall Pro MCP Worker — Cloudflare configuration
#
# This worker is deployed via Cloudflare Workers Builds (git-connect).
# Commits to your repo's main branch auto-trigger deployments.
#
# Secrets (HCP_API_KEY, HCP_WEBHOOK_SECRET) are managed in the
# Cloudflare dashboard (Settings → Variables and Secrets).

name = "hcp-mcp"
main = "worker.js"
compatibility_date = "2026-05-09"

# Optional: Add KV namespace for activity/webhook storage
# [[kv_namespaces]]
# binding = "HCP_ACTIVITY"
# id = "your-kv-namespace-id-here"
