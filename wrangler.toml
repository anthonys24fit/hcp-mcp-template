# HouseCall Pro MCP Worker — Cloudflare configuration
#
# Deployed via Cloudflare Workers Builds (git-connect).
# Commits to your repo's main branch auto-trigger deployments.
#
# Secrets (HCP_API_KEY, HCP_WEBHOOK_SECRET, ZAPIER_URL) stay in the dashboard
# under Settings → Variables and Secrets. Wrangler does not wipe secrets.

name = "your-hcp-mcp-worker"
main = "worker.js"
compatibility_date = "2026-05-10"
