# HouseCall Pro MCP Worker — Cloudflare configuration
#
# Deployed via Cloudflare Workers Builds (git-connect).
# Commits to your repo's main branch auto-trigger deployments.
#
# IMPORTANT: KV namespaces MUST be declared here, not just in the Cloudflare
# dashboard. Wrangler treats this file as the source of truth for bindings —
# anything only configured in the dashboard gets removed on the next deploy.
#
# Secrets (HCP_API_KEY, HCP_WEBHOOK_SECRET, ZAPIER_URL) stay in the dashboard
# under Settings → Variables and Secrets. Wrangler does not wipe secrets.
#
# SETUP REQUIRED: Replace the two placeholder KV IDs below with your real IDs.
# See README.md → "KV Namespaces" for how to create them.

name = "your-hcp-mcp-worker"
main = "worker.js"
compatibility_date = "2026-05-10"

# KV namespace for webhook activity storage (48h TTL per event)
# Create this in Cloudflare dashboard → KV → Create namespace → name it anything
# Then paste the namespace ID below.
[[kv_namespaces]]
binding = "ACTIVITY_KV"
id = "YOUR_ACTIVITY_KV_ID"

# KV namespace for MCP access tokens (read/write tiers)
# Create this in Cloudflare dashboard → KV → Create namespace → name it anything
# Then paste the namespace ID below.
# After deploying, add token entries: key = your-token-string, value = {"name":"Your Name","tier":"write"}
[[kv_namespaces]]
binding = "MCP_TOKENS"
id = "YOUR_MCP_TOKENS_KV_ID"
